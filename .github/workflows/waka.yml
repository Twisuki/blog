name: 更新 Waka 数据并重新部署

on:
  push:
    branches:
      - hope
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  waka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (Twisuki/Twisuki)
        uses: actions/checkout@v4
        with:
          repository: Twisuki/Twisuki
          path: source-repo

      - name: Checkout target repo (Twisuki/blog)
        uses: actions/checkout@v4
        with:
          repository: Twisuki/blog
          path: target-repo
          token: ${{ secrets.GH_TOKEN }}

      - name: Update Waka section (src/intro.md)
        run: node target-repo/scripts/update-waka.mjs source-repo/README.md target-repo/src/intro.md

      - name: Commit and push changes
        id: commit
        run: |
          cd target-repo
          git config user.name "Twis Waka Bot"
          git config user.email "100500860+Twisuki@users.noreply.github.com"
          git add src/intro.md
          
          if git diff --quiet --cached; then
            echo "::notice::No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update waka stats"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          fi

      - name: Repository Dispatch to deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: deploy
