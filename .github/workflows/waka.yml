name: Update Waka Stats and Deploy

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 00:00 运行
  workflow_dispatch:     # 允许手动触发

jobs:
  update-waka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Twisuki repo
        uses: actions/checkout@v4
        with:
          repository: Twisuki/Twisuki
          path: twisuki-repo

      - name: Extract Waka section
        id: extract-waka
        run: |
          # 使用 perl 提取 Waka 部分，处理多行和特殊字符更可靠
          WAKA_SECTION=$(perl -ne 'print if /<!--START_SECTION:waka-->/../<!--END_SECTION:waka-->/' twisuki-repo/README.md)
          # 存储到临时文件
          echo "$WAKA_SECTION" > waka_section.txt
          # 使用 base64 编码避免特殊字符问题
          WAKA_BASE64=$(base64 -w 0 waka_section.txt)
          echo "WAKA_BASE64=${WAKA_BASE64}" >> $GITHUB_ENV

      - name: Checkout Twisuki.github.io repo
        uses: actions/checkout@v4
        with:
          repository: Twisuki/Twisuki.github.io
          path: twisuki-io-repo
          token: ${{ secrets.GH_TOKEN }}

      - name: Update intro.md
        run: |
          # 解码 Waka 部分
          echo "$WAKA_BASE64" | base64 --decode > waka_section_decoded.txt
          
          # 使用 awk 处理文件替换，避免 shell 解释特殊字符
          awk '
            BEGIN {
              RS = "\0"  # 将记录分隔符设为空字符，处理多行
              while ((getline line < "waka_section_decoded.txt") > 0)
                waka = waka line ORS
              close("waka_section_decoded.txt")
            }
            /<!--START_SECTION:waka-->/,/<!--END_SECTION:waka-->/ {
              if (/<!--START_SECTION:waka-->/) { print; in_section=1; next }
              if (/<!--END_SECTION:waka-->/) { in_section=0; printf "%s", waka; next }
              next
            }
            !in_section { print }
          ' twisuki-io-repo/src/intro.md > tmp_intro.md
          
          mv tmp_intro.md twisuki-io-repo/src/intro.md
          rm waka_section_decoded.txt

      - name: Commit and push changes
        run: |
          cd twisuki-io-repo
          git config user.name "Twisuki"
          git config user.email "100500860+Twisuki@users.noreply.github.com"
          git add src/intro.md
          git commit -m "chore: update waka stats [skip ci]"
          git push

      - name: Trigger deploy workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: Twisuki/Twisuki.github.io
          event-type: trigger-deploy
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Twisuki',
              repo: 'Twisuki.github.io',
              workflow_id: 'deploy-docs.yml',
              ref: 'main'
            })
